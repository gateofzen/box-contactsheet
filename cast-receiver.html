<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="cs-role" content="cast-receiver">
<meta name="cs-version" content="20">
<title>Contact Sheet</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #msg{position:fixed;left:0;right:0;top:6vh;text-align:center;color:#E8B04B;
    font-family:system-ui,sans-serif;font-size:2vw;letter-spacing:.1em}
</style>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="msg">Contact Sheet</div>

<script>
// まず「起動できること」だけを確実にする。
// 余計な指定を足すと、1 つでも合わないと起動そのものが失敗し、
// 送信側には session_error としか届かない。
var msg = document.getElementById("msg");
var ctx = cast.framework.CastReceiverContext.getInstance();
var pm  = ctx.getPlayerManager();
var NS  = "urn:x-cast:com.contactsheet";
var token = "";
var audioMpdUrl = null;

var lastSender = null;   // 送り先。届いた指示から拾う。
var stallCount = 0, stallSince = 0, stallSec = 0;
var sendFail = 0;

function reply(o){
  // 文字列にして渡すと、環境によってはさらに包まれて二重になる。
  // そのまま渡し、駄目なときだけ文字列で試す。
  // 全員に向けて送る。送り先を固定すると、別の端末に持ち替えたときに届かない。
  var ok = false;
  try{ ctx.sendCustomMessage(NS, undefined, o); ok = true; }catch(e){}
  if (!ok){ try{ ctx.sendCustomMessage(NS, undefined, JSON.stringify(o)); ok = true; }catch(e){} }
  if (!ok && lastSender){
    try{ ctx.sendCustomMessage(NS, lastSender, o); ok = true; }catch(e){}
  }
  if (!ok && sendFail < 1){
    sendFail++;
    msg.style.display = "";
    msg.textContent = "Contact Sheet（手元と通信できません）";
  }
}

function withToken(url){
  if (!token || !url) return url;
  return url.indexOf("access_token=") >= 0 ? url
    : url + (url.indexOf("?") >= 0 ? "&" : "?") + "access_token=" + encodeURIComponent(token);
}

// 認証つきで取りに行けるようにする
try{
  var pc = new cast.framework.PlaybackConfig();
  pc.manifestRequestHandler = function(r){ r.url = withToken(r.url); };
  pc.segmentRequestHandler  = function(r){ r.url = withToken(r.url); };
  // 見積もりを低く始めると最低画質に張り付く。高めから始める。
  pc.initialBandwidth = 12000000;
  pm.setPlaybackConfig(pc);
}catch(e){ msg.textContent = "Contact Sheet（認証の設定を省略）"; }

var announced = false;
// 画質の上限を伝える。低い値のまま張り付くのを防ぐため、下限も添える。
function applyQuality(maxHeight, fixed){
  try{
    var cfg = (pm.getPlaybackConfig && pm.getPlaybackConfig()) || new cast.framework.PlaybackConfig();
    // 見積もりの初期値。低く見積もると最低画質から始まり、戻るのに時間がかかる。
    cfg.initialBandwidth = (!maxHeight || maxHeight >= 1080) ? 12000000
                         : (maxHeight >= 720 ? 5000000 : 2500000);
    cfg.autoResumeDuration = 5;
    pm.setPlaybackConfig(cfg);
    reply({type:"quality-ok", maxHeight: maxHeight || 0, fixed: !!fixed});
  }catch(err){ reply({type:"warn", where:"画質の指定", message:String(err && err.message || err)}); }
}

ctx.addCustomMessageListener(NS, function(e){
  if (e && e.senderId){
    lastSender = e.senderId;
    if (!announced){          // 送り先が分かった時点で名乗り直す
      announced = true;
      reply({type:"started", version:20});
    }
  }
  var m;
  try{ m = typeof e.data === "string" ? JSON.parse(e.data) : e.data; }catch(_){ return; }
  if (!m || !m.type) return;

  if (m.type === "load"){
    token = m.token || token;
    if (!m.manifestText) msg.style.display = "none";
    var req = new cast.framework.messages.LoadRequestData();
    req.media = new cast.framework.messages.MediaInformation();
    // 音声専用の機器には、送られてきた音声だけの配信情報をその場で用意する
    if (m.manifestText){
      if (audioMpdUrl) URL.revokeObjectURL(audioMpdUrl);
      audioMpdUrl = URL.createObjectURL(
        new Blob([m.manifestText], {type:"application/dash+xml"}));
      req.media.contentUrl  = audioMpdUrl;
      req.media.contentType = "application/dash+xml";
      msg.textContent = "♪ " + (m.title || "Contact Sheet");
      msg.style.display = "";
    }else{
      req.media.contentUrl  = m.manifest || m.url;
      req.media.contentType = m.manifest ? "application/dash+xml" : "video/mp4";
    }
    req.currentTime = m.time || 0;
    req.autoplay = true;
    if (m.maxHeight || m.fixed || m.quality) applyQuality(m.maxHeight, m.fixed);
    reply({type:"load-received", time:req.currentTime});   // 受け取った合図
    pm.load(req).then(function(){ reply({type:"loaded", time:req.currentTime}); },
                      function(err){ reply({type:"error", message:String(err)}); });
  }
  else if (m.type === "quality") applyQuality(m.maxHeight, m.fixed);
  else if (m.type === "volume"){
    try{ ctx.setSystemVolumeLevel(Math.max(0, Math.min(1, m.value))); }catch(e){}
  }
  else if (m.type === "play")   pm.play();
  else if (m.type === "pause")  pm.pause();
  else if (m.type === "seek")   pm.seek(m.time);
  else if (m.type === "seekBy") pm.seek(Math.max(0, pm.getCurrentTimeSec() + m.delta));
  else if (m.type === "token")  token = m.token || token;
  else if (m.type === "stop"){  pm.stop(); msg.style.display = ""; }
});

// 読み込み待ちを数える。回線に対して重すぎるかの判断に使う。
try{
  pm.addEventListener(cast.framework.events.EventType.BUFFERING, function(e){
    if (e && e.isBuffering){ stallCount++; stallSince = Date.now(); }
    else if (stallSince){ stallSec += (Date.now() - stallSince) / 1000; stallSince = 0; }
  });
}catch(e){}

// 状況を返す（失敗しても再生は続ける）
// 位置は 1 秒ごとに送る（手元のつまみを滑らかに動かすため）
setInterval(function(){
  try{
    var t = pm.getCurrentTimeSec();
    if (!isFinite(t)) return;
    reply({type:"time", time:t, duration:pm.getDurationSec() || 0});
  }catch(e){}
}, 1000);

// 通信量や画質などの重い情報は 4 秒ごとで十分
setInterval(function(){
  try{
    var st = (pm.getStats && pm.getStats()) || {};
    var t = pm.getCurrentTimeSec();
    if (!isFinite(t)) return;
    reply({type:"stats", mode:"専用アプリ",
      estimate: Math.round((st.estimatedBandwidth||0)/1000),
      stream:   Math.round((st.streamBandwidth||0)/1000),
      dropped:  st.droppedFrames||0, decoded: st.decodedFrames||0,
      w: st.width||0, h: st.height||0,
      stalls: stallCount, buffering: Math.round(stallSec)});
  }catch(e){}
}, 4000);

// <cast-media-player> を置くと、CAF が起動の設定を自前で用意する。
// そこへ設定を渡すと「already provided」で拒否される。
// 通信経路は、設定ではなく個別の指定で登録する。
try{
  if (ctx.setCustomNamespace){
    var mt = (cast.framework.system && cast.framework.system.MessageType
              && cast.framework.system.MessageType.STRING) || "STRING";
    ctx.setCustomNamespace(NS, mt);
  }
}catch(e){ /* 使えなければ、受け取りの登録だけで進める */ }

try{
  if (cast.framework.system && cast.framework.system.EventType
      && cast.framework.system.EventType.SENDER_CONNECTED){
    ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, function(e){
      if (e && e.senderId) lastSender = e.senderId;
      // 端末が変わってもすぐ会話できるよう、その場で名乗る
      reply({type:"started", version:20});
      var t = pm.getCurrentTimeSec();
      if (isFinite(t)) reply({type:"time", time:t, duration:pm.getDurationSec() || 0});
    });
  }
}catch(e){}

var startErr = null;
try{
  ctx.start();               // 設定は渡さない
}catch(e1){
  startErr = e1;
  msg.textContent = "起動できません: " + (e1 && e1.message || e1);
  msg.style.fontSize = "1.2vw";
  msg.style.whiteSpace = "pre-wrap";
}

if (!startErr){
  setTimeout(function(){ reply({type:"started", version:20}); }, 800);
  setTimeout(function(){ reply({type:"started", version:20}); }, 3000);
}

</script>
</body>
</html>
