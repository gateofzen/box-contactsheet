<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Sheet — Box 動画ライブラリ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1317; --surface:#181E24; --surface-2:#212A31; --line:#333E48; --line-soft:#262F37;
  --text:#E6EAED; --muted:#8B99A6; --amber:#E8B04B; --mint:#5FD3C4; --red:#FF6B6B;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --col:340px; --bar:54px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}   /* 引っ張って更新を邪魔しない */
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--mint)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
b{font-weight:600}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(18,23,28,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.topbar-in{max-width:1760px;margin:0 auto;padding:0 12px;height:var(--bar);
  display:flex;align-items:center;gap:8px}
.mark{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;white-space:nowrap;color:var(--text)}
.mark small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--muted);font-weight:400}
.iconbtn{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-soft);border-radius:8px;color:var(--muted);font-size:15px;transition:.14s}
.iconbtn:hover{border-color:var(--muted);color:var(--text)}
.iconbtn.on{background:var(--amber);border-color:var(--amber);color:#171208}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:var(--ink);
  border:1px solid var(--line-soft);border-radius:8px;padding:0 10px;height:38px}
.search:focus-within{border-color:var(--amber)}
.search span{color:var(--muted);font-size:13px}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:14px;height:36px}
.crumb{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.crumb b{color:var(--amber);font-weight:500}

.menu{position:absolute;right:10px;top:calc(var(--bar) - 6px);z-index:62;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;
  min-width:210px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.menu-item{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;
  font-size:13px;color:var(--text)}
.menu-item:hover{background:var(--surface-2)}
.menu-item.on{background:var(--amber);color:#171208;font-weight:700}
.menu-item.on::after{content:"　✓"}
@media (max-width:860px){ .menu{left:10px;right:10px;min-width:0} }

/* progress line */
.pbar{height:2px;background:transparent}
.pbar.on{background:linear-gradient(90deg,var(--amber),var(--mint),var(--amber));
  background-size:200% 100%;animation:slide 1.4s linear infinite}
@keyframes slide{to{background-position:-200% 0}}

.statusline{max-width:1760px;margin:0 auto;padding:0 12px;display:flex;gap:14px;align-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:0;overflow:hidden;
  max-height:0;transition:max-height .18s,padding .18s}
.statusline.on{max-height:34px;padding:7px 12px}
.statusline .msg{color:var(--amber)}
.statusline .msg.err{color:var(--red)}
.statusline .grow{flex:1}
.stopbtn{border:1px solid var(--red);color:var(--red);border-radius:6px;padding:3px 9px;font-size:10px}

/* ---------- layout ---------- */
.wrap{max-width:1760px;margin:0 auto;padding:14px 12px 90px;display:grid;
  grid-template-columns:236px 1fr;gap:20px;align-items:start}
.content{min-width:0}

/* ---------- folder drawer / sidebar ---------- */
.scrim-bg{position:fixed;inset:0;background:rgba(6,9,12,.6);z-index:59;display:none}
.scrim-bg.on{display:block}
.drawer{position:sticky;top:calc(var(--bar) + 14px);max-height:calc(100vh - var(--bar) - 30px);
  display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:10px;
  background:var(--surface);overflow:hidden}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 10px 9px;border-bottom:1px solid var(--line-soft);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drawer-head button{color:var(--muted);font-size:13px;padding:2px 5px;border-radius:5px}
.drawer-head button:hover{color:var(--amber)}
#tree{overflow-y:auto;overscroll-behavior:contain;padding:7px 5px 10px;font-family:var(--mono);font-size:11.5px;flex:1}
.node{display:flex;align-items:center;gap:1px;border-radius:6px}
.node:hover{background:var(--surface-2)}
.node.on{background:var(--amber)}
.node.on .nname,.node.on .ncount,.node.on .twist{color:#171208}
.node.on .nname{font-weight:700}
.twist{width:18px;flex:none;color:var(--muted);font-size:9px;padding:6px 0;line-height:1}
.twist.leaf{visibility:hidden}
.twist.busy{color:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.nname{flex:1;text-align:left;padding:6px 2px;color:var(--text);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ncount{color:var(--muted);padding-right:7px;font-size:10px}
.vcount{display:none}
.kids{margin-left:12px;border-left:1px solid var(--line-soft);padding-left:2px}
.tree-empty{padding:10px;color:var(--muted)}
.drawer-foot{border-top:1px solid var(--line-soft);padding:8px 10px;font-family:var(--mono);
  font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-foot b{color:var(--amber);font-weight:500}

/* ---------- chips ---------- */
.scopeline{font-family:var(--mono);font-size:11px;color:var(--amber);padding:0 2px 8px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:999px;
  padding:4px 11px;font-family:var(--mono);font-size:11px;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;transition:.13s;white-space:nowrap}
.chip:hover{border-color:var(--muted);color:var(--text)}
.chip.active{background:var(--amber);border-color:var(--amber);color:#171208;font-weight:700}
.chip .n{opacity:.6;font-size:10px}
.chip.fav{color:var(--amber)}
.chip.fav.active{color:#171208}

/* ---------- grid ---------- */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--col),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;
  overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--line)}
.card.picked{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}

.strip{position:relative;background:#000;cursor:pointer}
.hero{position:relative;aspect-ratio:16/9;background:#0B0E11;overflow:hidden}

.hero .tc{position:absolute;right:7px;bottom:7px;font-family:var(--mono);font-size:11px;
  padding:2px 7px;background:rgba(0,0,0,.72);color:#fff;border-radius:4px}
.rail{display:none}
.frames{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--line-soft);
  aspect-ratio:80/9;border-top:2px solid var(--surface)}
.frames.solo{grid-template-columns:1fr;aspect-ratio:16/9}
.frames .slot{background-repeat:no-repeat}
.hero .heroimg{position:absolute;inset:0;background-repeat:no-repeat;background-color:#0B0E11}
.frames .slot{position:relative;overflow:hidden;background:#0B0E11;cursor:pointer}
.frames .slot::after{content:attr(data-tc);position:absolute;left:0;bottom:0;font-family:var(--mono);
  font-size:9px;padding:1px 3px;background:rgba(0,0,0,.65);color:var(--amber);opacity:0;transition:opacity .12s}
.strip:hover .slot::after{opacity:1}
.frames .slot.sel{outline:2px solid var(--amber);outline-offset:-2px}
.strip .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);pointer-events:none}
.strip .fail{color:var(--red)}

.overlay{position:absolute;top:8px;display:flex;gap:6px;z-index:2}
.overlay.left{left:8px}
.overlay.right{right:8px}
/* 5 段階の評価。カードの右上に並べる。 */
.overlay.rate{gap:0;background:rgba(11,14,17,.6);border-radius:8px;padding:3px 5px;
  opacity:0;transition:opacity .15s}
.card:hover .overlay.rate, .overlay.rate.has{opacity:1}
.rb{background:transparent;border:none;padding:1px;font-size:15px;line-height:1;
  color:rgba(255,255,255,.32);cursor:pointer}
.rb.on{color:var(--amber)}
@media (max-width:860px){ .overlay.rate{opacity:1} .rb{font-size:17px;padding:2px} }

.ob{background:rgba(11,14,17,.72);border:1px solid rgba(255,255,255,.18);border-radius:7px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;line-height:1;color:#fff;opacity:.55;transition:.14s}
.card:hover .ob{opacity:1}
.ob:hover{border-color:var(--amber);color:var(--amber)}
.ob.on{background:var(--amber);border-color:var(--amber);color:#171208;opacity:1}
.hq{position:absolute;left:8px;bottom:8px;z-index:3;background:rgba(11,14,17,.72);
  border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 9px;
  font-family:var(--mono);font-size:10px;color:#fff;opacity:0;transition:.14s}
.card:hover .hq{opacity:.85}
.hq:hover{opacity:1;border-color:var(--amber);color:var(--amber)}
.hq.done{color:var(--mint);border-color:rgba(95,211,196,.5);opacity:.85}

.meta{padding:10px 12px 11px}
.name{font-family:var(--display);font-weight:500;font-size:13.5px;line-height:1.4;
  word-break:break-word;margin:0}
.taglist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tg{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:5px;padding:2px 7px;
  font-family:var(--mono);font-size:10px;color:var(--mint);display:inline-flex;align-items:center;gap:5px}
.tg x{cursor:pointer;color:var(--muted);font-style:normal}
.tg x:hover{color:var(--red)}
.tg-add{border:1px dashed var(--line);border-radius:5px;padding:2px 8px;font-family:var(--mono);
  font-size:10px;color:var(--muted)}
.tg-add:hover{border-color:var(--amber);color:var(--amber)}
.tg-in{background:var(--ink);border:1px solid var(--amber);border-radius:5px;padding:2px 6px;
  font-family:var(--mono);font-size:10px;width:120px}

/* per-card details */
.cardinfo{margin-top:7px}
.cardinfo summary{list-style:none;font-family:var(--mono);font-size:10px;color:var(--muted);
  cursor:pointer;padding:2px 0;display:flex;align-items:center;gap:5px}
.cardinfo summary::-webkit-details-marker{display:none}
.cardinfo summary::before{content:"▸";transition:transform .15s;display:inline-block}
.cardinfo[open] summary::before{transform:rotate(90deg)}
.cardinfo .rows{display:flex;flex-direction:column;gap:2px;padding:5px 0 2px;
  font-family:var(--mono);font-size:10px;color:var(--muted)}
.cardinfo .rows .dur{color:var(--amber)}
.cardinfo .rows .pl{color:var(--mint)}
.cardinfo .rows .fd{color:var(--mint);cursor:pointer;text-align:left}

.sentinel{padding:26px 0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:44px 22px;text-align:center}
.empty h2{font-family:var(--display);font-size:16px;letter-spacing:.04em;margin:0 0 10px}
.empty p{color:var(--muted);margin:5px 0;font-size:13px}
.empty code{font-family:var(--mono);font-size:12px;color:var(--amber)}

/* ---------- settings ---------- */
/* 設定は画面中央に浮かべる。一覧の末尾に置くと、
   動画が多いときにスクロールが追いつかず開けなくなるため。 */
/* 設定は ⚙ から開く。一覧の下に見出しを残すと二重に見えるので隠す。 */
#advBox:not([open]){display:none}
#advBox[open]{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(720px,94vw);max-height:86vh;overflow-y:auto;overscroll-behavior:contain;
  z-index:66;margin:0;box-shadow:0 24px 70px rgba(0,0,0,.65);border-color:var(--line);
}
#advBox[open]>summary{position:sticky;top:0;background:var(--surface);z-index:1;
  border-bottom:1px solid var(--line-soft)}
#advBox[open]>summary::after{content:"閉じる";margin-left:auto;color:var(--amber)}
@media (max-width:860px){
  /* 設定は ⚙ から開く。一覧の下に見出しを残すと二重に見えるので隠す。 */
#advBox:not([open]){display:none}
#advBox[open]{width:100vw;height:100vh;max-height:100vh;border-radius:0;border:none;
    top:0;left:0;transform:none}
}

.panel{margin-top:20px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface)}
.panel>summary{list-style:none;padding:12px 14px;cursor:pointer;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::before{content:"▸";transition:transform .15s;display:inline-block}
.panel[open]>summary::before{transform:rotate(90deg)}
.panel-body{padding:2px 14px 16px;border-top:1px solid var(--line-soft)}
.group{padding:13px 0;border-bottom:1px solid var(--line-soft)}
.group:last-child{border-bottom:none}
.group h4{margin:0 0 9px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--amber);font-weight:500}
.group p.note{margin:6px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55}
.rack{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{background:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;font-family:var(--mono);font-size:12px}
.field input:focus,.field select:focus{border-color:var(--amber);outline:none}
.w-token{width:min(320px,72vw)} .w-id{width:120px} .w-num{width:78px} .w-search{width:min(240px,70vw)}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;
  font-family:var(--mono);font-size:11px;transition:.14s}
.btn:hover{border-color:var(--muted)}
.btn-go{background:var(--amber);border-color:var(--amber);color:#171208;font-weight:700}
.btn-go:hover{background:#F2BC5C}
.btn-stop{border-color:var(--red);color:var(--red)}
.btn-sm{padding:5px 9px;font-size:10px}
.check{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  color:var(--muted);padding-bottom:8px;white-space:nowrap;cursor:pointer}
.check input{accent-color:var(--amber)}
.report{margin:10px 0 0;padding:10px 12px;background:var(--ink);border:1px solid var(--line-soft);
  border-radius:6px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--muted);
  white-space:pre-wrap;max-height:300px;overflow:auto}
.report b{color:var(--amber);font-weight:500}
.debug{margin-top:12px;font-family:var(--mono);font-size:11px}
.debug summary{cursor:pointer;color:var(--muted);padding:6px 0}
.debug pre{margin:0;padding:8px 0;white-space:pre-wrap;color:var(--muted);max-height:260px;overflow:auto}

/* ---------- bulk bar ---------- */
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:none;gap:8px;flex-wrap:wrap;
  align-items:center;background:var(--amber);color:#171208;padding:10px 12px;
  font-family:var(--mono);font-size:11px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.bulkbar.on{display:flex}
.bulkbar input[type=text]{background:#171208;color:#F0E6D2;border:none;border-radius:6px;
  padding:6px 9px;font-family:var(--mono);font-size:11px;width:150px}
.bulkrate{display:flex;align-items:center;gap:3px;font-size:12px}
.bulkbar .btn{background:#171208;border-color:#171208;color:#F0E6D2}

/* ---------- player ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,12,.93);z-index:70;overscroll-behavior:none;display:none;
  align-items:center;justify-content:center;padding:16px}
.scrim.open{display:flex}
.player{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.player-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
/* 端末側のコントロールには手を出さない。
   一部を隠すと機種によって再生バーごと壊れることがあるため。 */

.volbox{display:flex;align-items:center;gap:5px;font-size:12px}
.volbox input[type=range]{width:74px;accent-color:var(--amber);background:transparent}
@media (max-width:860px){ .volbox input[type=range]{width:60px} }
.player-bar{flex-wrap:wrap;row-gap:8px}
.player-bar .t{font-family:var(--display);font-size:13px;font-weight:500;flex:1 1 200px;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 二本指の操作を横取りするため touch-action は常に none。
   プレーヤーは前面の覆いなので、背後の画面が動かなくても困らない。 */
.vzoom{position:relative;overflow:hidden;background:#000;touch-action:none}
.vzoom.zoomed{cursor:grab}
.vzoom:fullscreen{display:flex;align-items:center;justify-content:center;
  width:100vw;height:100vh;background:#000}
.vzoom:fullscreen video{max-height:100vh;max-width:100vw;width:auto;height:auto;object-fit:contain}
.vzoom:-webkit-full-screen{display:flex;align-items:center;justify-content:center;
  width:100vw;height:100vh;background:#000}
.vzoom:-webkit-full-screen video{max-height:100vh;max-width:100vw;object-fit:contain}
.vzoom.zoomed:active{cursor:grabbing}
.player video{width:100%;max-height:66vh;background:#000;display:block;
  transform-origin:center center;will-change:transform}
.castpanel[hidden]{display:none}
.castpanel{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:rgba(11,14,17,.96);padding:24px}
.castpanel .big{font-family:var(--display);font-size:18px;color:var(--amber)}
.castpanel .ctime{font-family:var(--mono);font-size:13px;color:var(--muted)}
.castpanel input[type=range]{width:min(460px,86%);accent-color:var(--amber)}
.castpanel .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.castq{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:12px}
.castpanel .sub{font-family:var(--mono);font-size:10.5px;color:var(--line)}
.audioveil[hidden]{display:none}
.audioveil{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  background:rgba(11,14,17,.94);text-align:center;cursor:pointer;padding:20px}
.audioveil .big{font-family:var(--display);font-size:17px;color:var(--amber);margin-bottom:8px}
.audioveil .sub{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7}
#pAudio{display:none}
.player-foot{padding:9px 12px;font-family:var(--mono);font-size:10.5px;color:var(--muted);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.player-foot .keys{color:var(--line);font-size:9.5px;flex:1;text-align:right}
